<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bingo do André</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1.5rem 1rem;
            color: #333;
        }

        h1 {
            color: #fff;
            font-size: clamp(2rem, 5vw, 3.5rem);
            margin-bottom: 1.5rem;
            text-align: center;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .card-wrapper {
            background: white;
            padding: 1.5rem;
            border: 2px solid #000;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            margin-bottom: 1.5rem;
            display: inline-block;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 0;
            border: 1px solid #000;
            background: #000;
            aspect-ratio: 8 / 3;
            width: min(calc(95vw - 3rem - 4px), 1400px);
            height: min(calc(70vh - 3rem - 4px), calc(1400px * 3 / 8));
        }

        .cell {
            border: 1px solid #000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(0.7rem, 1.2vw, 1.2rem);
            font-weight: 600;
            cursor: pointer;
            user-select: none;
            transition: all 0.2s ease;
            padding: 0.3rem;
            text-align: center;
            word-break: keep-all;
            overflow-wrap: normal;
            line-height: 1.2;
        }

        .cell.filled {
            background: white;
        }

        .cell.filled:hover {
            background: #f0f0f0;
            transform: scale(0.95);
        }

        .cell.filled.selected {
            background: linear-gradient(135deg, #ffd700 0%, #ffed4e 100%);
            box-shadow: inset 0 0 10px rgba(255, 215, 0, 0.5);
        }

        .cell.empty {
            cursor: default;
            background: var(--cell-color);
        }

        .buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            padding: 1rem 2.5rem;
            font-size: 1.3rem;
            font-weight: 600;
            border: 2px solid #000;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
        }

        #clearBtn {
            background: #e74c3c;
            color: white;
        }

        #clearBtn:hover {
            background: #c0392b;
            transform: translateY(-2px);
            box-shadow: 0 6px 8px rgba(0, 0, 0, 0.3);
        }

        #newSessionBtn {
            background: #2ecc71;
            color: white;
            position: relative;
            z-index: 1001;
        }

        #newSessionBtn:hover {
            background: #27ae60;
            transform: translateY(-2px);
            box-shadow: 0 6px 8px rgba(0, 0, 0, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        .victory-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            animation: fadeIn 0.5s ease;
        }

        .victory-overlay.show {
            display: flex;
        }

        .victory-message {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            padding: 3rem;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            animation: bounceIn 0.6s ease;
        }

        .victory-message h2 {
            font-size: clamp(2rem, 6vw, 4rem);
            color: white;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.3);
            margin-bottom: 1rem;
        }

        .victory-message p {
            font-size: clamp(1rem, 3vw, 1.5rem);
            color: white;
        }

        #confettiCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 999;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes bounceIn {
            0% { transform: scale(0.3); opacity: 0; }
            50% { transform: scale(1.05); }
            70% { transform: scale(0.9); }
            100% { transform: scale(1); opacity: 1; }
        }

        @media (max-width: 768px) {
            body {
                padding: 1rem 0.5rem;
            }

            .card-wrapper {
                padding: 0.5rem;
            }

            button {
                padding: 0.6rem 1.5rem;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <h1>Bingo do André</h1>

    <div class="card-wrapper">
        <div class="grid" id="bingoGrid"></div>
    </div>

    <div class="buttons">
        <button id="clearBtn">Clear</button>
        <button id="newSessionBtn">New Session</button>
    </div>

    <canvas id="confettiCanvas"></canvas>

    <div class="victory-overlay" id="victoryOverlay">
        <div class="victory-message">
            <h2>🎉 BINGO! 🎉</h2>
            <p>Parabéns! Você completou o cartão!</p>
        </div>
    </div>

    <script>
        // Configuration
        const ROWS = 3;
        const COLS = 8;
        const FILLED_PER_ROW = 5;
        const PLACEHOLDER_CONTENT = [
            "Só falta QA",
            "É preciso cuidado com os edge cases!!!",
            "É preciso testar",
            "Tudo direitinho",
            "Pendo",
            "Tenho que ir comer",
            "Não posso, tenho treino/ginásio",
            "Já fui treinar às 6h30",
            "Já trabalhei na Farfetch",
            "Na Farfetch é que isso era bem feito",
            "A minha namorada trabalha na Farfetch",
            "Tenho um amigo ",
            "Dynamic forms estão impecáveis",
            "Se precisares conheço um gajo",
            "Isso tem que se pedir a X",
            "Restaurante / bar / viagem a que fui é incrível, tens que experimentar",
            "Na Maia tens um lugar melhor",
            "A minha família tem não sei o quê",
            "Foi o meu avô que construiu a Maia",
            "Estou à espera que alguém faça Y",
            "Estive a fazer os testes de integração",
            "Então, não consegues arranjar uma horinha por dia para treinar?",
            "Quando é que vêem para o Padle?"
        ];

        const PASTEL_COLORS = [
            '#FFB3BA', // pastel pink
            '#BAFFC9', // pastel mint
            '#BAE1FF', // pastel blue
            '#FFFFBA', // pastel yellow
            '#E0BBE4', // pastel lavender
            '#FFDAB9', // pastel peach
            '#D4A5A5', // pastel mauve
            '#C7CEEA', // pastel periwinkle
            '#B5EAD7', // pastel mint green
            '#FFE5B4', // pastel apricot
            '#C5E3F6', // pastel sky blue
            '#E8DCC3'  // pastel sage
        ];

        // State
        let cardData = [];
        let completedRows = new Set();
        let audioContext = null;
        let sessionEmptyColor = null;
        let hasPlayedLineSound = false;

        // DOM Elements
        const grid = document.getElementById('bingoGrid');
        const clearBtn = document.getElementById('clearBtn');
        const newSessionBtn = document.getElementById('newSessionBtn');
        const victoryOverlay = document.getElementById('victoryOverlay');
        const confettiCanvas = document.getElementById('confettiCanvas');
        const ctx = confettiCanvas.getContext('2d');

        // Initialize audio context on first user interaction
        function initAudioContext() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        // Utility: Shuffle array (Fisher-Yates)
        function shuffle(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // Generate random positions for filled cells in a row
        function getRandomFilledPositions() {
            const positions = shuffle([...Array(COLS).keys()]);
            return positions.slice(0, FILLED_PER_ROW).sort((a, b) => a - b);
        }

        // Generate card data
        function generateCard() {
            const shuffledContent = shuffle(PLACEHOLDER_CONTENT);
            let contentIndex = 0;
            const newCardData = [];

            // Select one color for all empty cells in this session
            sessionEmptyColor = PASTEL_COLORS[Math.floor(Math.random() * PASTEL_COLORS.length)];

            for (let row = 0; row < ROWS; row++) {
                const filledPositions = new Set(getRandomFilledPositions());
                const rowData = [];

                for (let col = 0; col < COLS; col++) {
                    if (filledPositions.has(col)) {
                        rowData.push({
                            type: 'filled',
                            content: shuffledContent[contentIndex++],
                            selected: false
                        });
                    } else {
                        rowData.push({
                            type: 'empty',
                            color: sessionEmptyColor
                        });
                    }
                }

                newCardData.push(rowData);
            }

            return newCardData;
        }

        // Render card
        function renderCard() {
            grid.innerHTML = '';

            cardData.forEach((row, rowIndex) => {
                row.forEach((cell, colIndex) => {
                    const cellDiv = document.createElement('div');
                    cellDiv.className = `cell ${cell.type}`;

                    if (cell.type === 'filled') {
                        cellDiv.textContent = cell.content;
                        if (cell.selected) {
                            cellDiv.classList.add('selected');
                        }
                        cellDiv.addEventListener('click', () => handleCellClick(rowIndex, colIndex));
                    } else {
                        cellDiv.style.setProperty('--cell-color', cell.color);
                    }

                    grid.appendChild(cellDiv);
                });
            });
        }

        // Handle cell click
        function handleCellClick(row, col) {
            const cell = cardData[row][col];
            if (cell.type !== 'filled') return;

            initAudioContext();
            cell.selected = !cell.selected;
            renderCard();
            checkCompletions();
        }

        // Check for row and full completions
        function checkCompletions() {
            // Track newly completed rows in this check
            let newlyCompletedCount = 0;

            // Check each row
            cardData.forEach((row, rowIndex) => {
                const filledCells = row.filter(cell => cell.type === 'filled');
                const allSelected = filledCells.every(cell => cell.selected);

                if (allSelected && filledCells.length > 0 && !completedRows.has(rowIndex)) {
                    completedRows.add(rowIndex);
                    newlyCompletedCount++;
                }
            });

            // Only trigger celebration for newly completed rows, and only if we haven't played the line sound yet
            if (newlyCompletedCount > 0 && !hasPlayedLineSound) {
                onRowComplete();
            }

            // Check if all cells are selected
            const allFilledCells = cardData.flat().filter(cell => cell.type === 'filled');
            const allCellsSelected = allFilledCells.length > 0 && allFilledCells.every(cell => cell.selected);

            if (allCellsSelected && completedRows.size === ROWS) {
                onFullComplete();
            }
        }

        // Row completion handler
        function onRowComplete() {
            playRowCompleteSound();
            launchConfetti(50);
            hasPlayedLineSound = true;
        }

        // Full completion handler
        function onFullComplete() {
            playFullCompleteSound();
            launchConfetti(200);
            setTimeout(() => {
                victoryOverlay.classList.add('show');
            }, 500);
        }

        // Play row complete sound
        function playRowCompleteSound() {
            if (!audioContext) return;

            const notes = [523.25, 659.25]; // C5, E5
            const duration = 0.15;

            notes.forEach((freq, index) => {
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();

                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);

                oscillator.frequency.value = freq;
                oscillator.type = 'sine';

                gainNode.gain.setValueAtTime(0.3, audioContext.currentTime + index * duration);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + index * duration + duration);

                oscillator.start(audioContext.currentTime + index * duration);
                oscillator.stop(audioContext.currentTime + index * duration + duration);
            });
        }

        // Play full complete sound
        function playFullCompleteSound() {
            if (!audioContext) return;

            const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
            const duration = 0.2;

            notes.forEach((freq, index) => {
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();

                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);

                oscillator.frequency.value = freq;
                oscillator.type = 'sine';

                gainNode.gain.setValueAtTime(0.3, audioContext.currentTime + index * duration);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + index * duration + duration * 1.5);

                oscillator.start(audioContext.currentTime + index * duration);
                oscillator.stop(audioContext.currentTime + index * duration + duration * 1.5);
            });
        }

        // Confetti system
        let confettiPieces = [];
        let animationId = null;

        function resizeCanvas() {
            confettiCanvas.width = window.innerWidth;
            confettiCanvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class ConfettiPiece {
            constructor() {
                this.x = Math.random() * confettiCanvas.width;
                this.y = -20;
                this.w = Math.random() * 10 + 5;
                this.h = Math.random() * 10 + 5;
                this.vx = Math.random() * 4 - 2;
                this.vy = Math.random() * 3 + 2;
                this.rotation = Math.random() * 360;
                this.rotationSpeed = Math.random() * 10 - 5;
                this.color = PASTEL_COLORS[Math.floor(Math.random() * PASTEL_COLORS.length)];
                this.gravity = 0.1;
            }

            update() {
                this.vy += this.gravity;
                this.x += this.vx;
                this.y += this.vy;
                this.rotation += this.rotationSpeed;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation * Math.PI / 180);
                ctx.fillStyle = this.color;
                ctx.fillRect(-this.w / 2, -this.h / 2, this.w, this.h);
                ctx.restore();
            }

            isOffScreen() {
                return this.y > confettiCanvas.height + 20;
            }
        }

        function launchConfetti(count) {
            for (let i = 0; i < count; i++) {
                confettiPieces.push(new ConfettiPiece());
            }

            if (!animationId) {
                animateConfetti();
            }
        }

        function animateConfetti() {
            ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);

            confettiPieces = confettiPieces.filter(piece => !piece.isOffScreen());

            confettiPieces.forEach(piece => {
                piece.update();
                piece.draw();
            });

            if (confettiPieces.length > 0) {
                animationId = requestAnimationFrame(animateConfetti);
            } else {
                animationId = null;
            }
        }

        // Clear button handler
        clearBtn.addEventListener('click', () => {
            initAudioContext();
            // Reset completed rows tracking but NOT the hasPlayedLineSound flag
            completedRows.clear();
            cardData.forEach(row => {
                row.forEach(cell => {
                    if (cell.type === 'filled') {
                        cell.selected = false;
                    }
                });
            });
            renderCard();
        });

        // New session button handler
        newSessionBtn.addEventListener('click', () => {
            initAudioContext();
            completedRows.clear();
            hasPlayedLineSound = false; // Reset the line sound flag for new session
            cardData = generateCard();
            renderCard();
            victoryOverlay.classList.remove('show');
        });

        // Initialize
        cardData = generateCard();
        renderCard();
    </script>
</body>
</html>
